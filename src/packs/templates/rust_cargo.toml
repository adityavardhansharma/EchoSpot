[package]
name = "echospot-pack-__ID__"
version = "0.1.0"
edition = "2024"
publish = false

# A component EchoSpot loads: `cargo build --release --target wasm32-wasip2`, which EchoSpot runs.
[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.57"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
