[package]
name = "echospot"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "EchoSpot: a native command palette for Hyprland / Omarchy, a Linux port of Tinycast drawn with Rune."

[[bin]]
name = "echospot"
path = "src/main.rs"

[dependencies]
# rune-dock is EchoDock's Rune (Rune's `dev` at 2d4ceb9, plus the Liquid Glass lens lighting),
# kept in this repository as its own workspace.
rune = { path = "rune-dock/crates/rune" }
rune-kit = { path = "rune-dock/crates/rune-kit", features = ["markdown"] }
rune-fx = { path = "rune-dock/crates/rune-fx" }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The live backdrop: each window behind a panel, read through Hyprland's toplevel export.
wayland-client = "0.31"
wayland-backend = "0.3"
wayland-scanner = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
rustix = { version = "1", features = ["fs", "mm"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
bitflags = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Rune's vendored crates must be patched by every app that builds it.
[patch.crates-io]
wgpu-hal = { path = "rune-dock/vendor/wgpu-hal" }
winit = { path = "rune-dock/vendor/winit" }
parley_engine = { path = "rune-dock/vendor/parley_engine" }
accesskit_windows = { path = "rune-dock/vendor/accesskit_windows" }

[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.dev.package."*"]
debug = false
opt-level = 3

[profile.release]
opt-level = 3
codegen-units = 16
incremental = true
