[package]
name = "echospot"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "EchoSpot: a native command palette for Hyprland / Omarchy, a Linux port of Tinycast drawn with Rune."

[[bin]]
name = "echospot"
path = "src/main.rs"

[dependencies]
# Rune is pre-release; this follows the local checkout of its `dev` branch.
# To build elsewhere: rune = { git = "https://github.com/anomalyco/rune", rev = "<dev rev>" }
rune = { path = "../rune/crates/rune" }
rune-kit = { path = "../rune/crates/rune-kit", features = ["markdown"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.dev.package."*"]
debug = false
opt-level = 3

[profile.release]
opt-level = 3
codegen-units = 16
incremental = true
